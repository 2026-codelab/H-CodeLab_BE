# ===== 배포 환경 (SPRING_PROFILES_ACTIVE=deploy) =====
# 서버마다 달라지는 값은 환경변수(서버의 /srv/hcl/.env)에서 읽는다.

spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000     # 커넥션 획득 최대 대기 시간 (ms)
      idle-timeout: 600000          # 유휴 커넥션 유지 시간 (ms)
      max-lifetime: 1800000         # 커넥션 최대 수명 (ms), MariaDB wait_timeout 이하
      keepalive-time: 60000         # 유휴 커넥션 ping 주기 (ms)
      pool-name: HikariPool-Deploy
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

logging:
  level:
    com.project.handongjudge: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.type.descriptor.sql.BasicExtractor: OFF
  logback:
    rollingpolicy:
      max-file-size: 200MB
      max-history: 7
      total-size-cap: 1GB
  file:
    name: /var/log/handongjudge/application.log

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  access-token:
    expiration: 7200000    # 2시간
  refresh-token:
    expiration: 604800000  # 7일

auth:
  cookie:
    name: refreshToken
    secure: ${COOKIE_SECURE:true}         # HTTPS면 true, 도메인 없이 http로 쓰면 false
    same-site: ${COOKIE_SAME_SITE:Lax}    # 화면과 API가 같은 주소라 Lax면 충분
    domain: ${COOKIE_DOMAIN:}             # 비워두면 접속한 주소에 맞춰짐
    max-age: 604800        # 7일 (초)
    path: /
  cors:
    allowed-origins:
      - ${FRONTEND_URL}

app:
  frontend-url: ${FRONTEND_URL}
  ssh-tunnel:
    enabled: false